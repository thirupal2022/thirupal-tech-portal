name: React CI

on:
  push:
    branches:
      - develop
      - main
      - "release/**"

  pull_request:
    branches:
      - develop
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build