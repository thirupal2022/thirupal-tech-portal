name: React CI/CD

on:
  push:
    branches:
      - develop
      - main
      - "release/**"

  pull_request:
    branches:
      - develop
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: validate

    # Deploy only after a push/merge to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show deployment information
        run: |
          echo "========================================"
          echo "Commit being deployed:"
          git rev-parse HEAD

          echo "========================================"
          echo "Latest commit:"
          git log -1 --oneline

          echo "========================================"
          echo "Branch:"
          git branch --show-current

      - name: Build React application
        run: npm run build

      - name: Verify build output
        run: |
          echo "========================================"
          echo "Generated files:"
          find dist -maxdepth 2 -type f

          echo "========================================"
          echo "Generated index.html:"
          cat dist/index.html

          echo "========================================"
          echo "JavaScript checksums:"
          sha256sum dist/assets/*.js

          echo "========================================"
          echo "CSS checksums:"
          sha256sum dist/assets/*.css

          echo "========================================"
          echo "Build directory size:"
          du -sh dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://thirupaltech.com --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3KFKF0AOZ0SBW \
            --paths "/*"

      - name: Deployment completed
        run: |
          echo "========================================"
          echo "Deployment completed successfully"
          echo "S3 bucket: s3://thirupaltech.com"
          echo "CloudFront distribution: E3KFKF0AOZ0SBW"
          echo "========================================"